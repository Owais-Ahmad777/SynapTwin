services:
  - type: web
    name: synaptwin
    runtime: python
    plan: free
    region: singapore
    buildCommand: "cd synaptwin-root/s24_frontend && npm install && npm run build && cd ../s24_backend && pip install --prefer-binary -r requirements.txt"
    startCommand: "cd synaptwin-root/s24_backend && python data/ensure_dataset.py && gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --max-requests 200 --max-requests-jitter 20 --keep-alive 5 --access-logfile -"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: FERNET_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://synaptwin.onrender.com
      - key: ENABLE_LIVE_LLM_PER_HOUR
        value: "false"
      - key: SIM_CACHE_TTL_SEC
        value: "300"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: OPEN_METEO_TIMEOUT_SEC
        value: "12"
      - key: OPEN_METEO_CACHE_TTL_HOURS
        value: "6"
      # Hugging Face dataset storage (free, no credit card):
      - key: HF_TOKEN
        sync: false
      - key: HF_DATASET_REPO
        value: "OwaisAhmad1/SynapTwin-Dataset"
